spring.application.name=midas_api



# ==============================================================================
# Banco de dados (PostgreSQL)
# ==============================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ==============================================================================
# O banco ja foi criado por completo por script SQL.
# então o ddl-auto=validate faz o Hibernate CONFERIR se as entidades batem com o
# schema real na inicializacao, sem tentar criar/alterar nada sozinho.
# Se a aplicacao falhar ao subir é sinal de mais alguma divergencia Entity x SQL
# ==============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false



