<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Leilões - Midas</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/meus-leiloes.css">
</head>
<body class="dark-page my-auctions-page" data-root=".." data-page="meus-leiloes">
    <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>
    <header class="navbar" data-site-header></header>

    <main id="conteudo-principal" class="page-shell" tabindex="-1">
        <div class="container">
            <nav class="tabs" aria-label="Tipos de leilões do usuário">
                <a id="tab-favorites" href="meus-leiloes.html?aba=favoritos">Favoritados</a>
                <a id="tab-created" href="meus-leiloes.html?aba=criados">Abertos por Você</a>
                <a id="tab-bids" href="meus-leiloes.html?aba=lances">Com seus Lances</a>
            </nav>

            <header class="page-heading">
                <h1 id="my-auctions-title">Meus Leilões</h1>
                <p id="my-auctions-description">Acompanhe os itens relacionados à sua conta.</p>
            </header>

            <form id="my-auctions-filter-form" class="filters-panel" novalidate>
                <div class="form-field">
                    <label for="my-min-price">Preço mínimo</label>
                    <input id="my-min-price" name="minPrice" type="number" min="0" step="0.01">
                </div>
                <div class="form-field">
                    <label for="my-max-price">Preço máximo</label>
                    <input id="my-max-price" name="maxPrice" type="number" min="0" step="0.01">
                </div>
                <div class="form-field">
                    <label for="my-ending">Tempo para acabar</label>
                    <select id="my-ending" name="ending">
                        <option value="all">Qualquer tempo</option>
                        <option value="24">Até 24 horas</option>
                        <option value="72">Até 3 dias</option>
                        <option value="168">Até 7 dias</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="my-brand">Marca</label>
                    <input id="my-brand" name="brand" type="text">
                </div>
                <div class="form-field">
                    <label for="my-item-id">ID do item</label>
                    <input id="my-item-id" name="itemId" type="text">
                </div>
                <div class="form-field">
                    <label for="my-category">Categoria</label>
                    <input id="my-category" name="category" type="text">
                </div>
                <div class="filters-actions">
                    <button class="btn-secondary" type="reset">Limpar filtros</button>
                    <a class="btn-primary" href="criar-leilao.html">Criar novo leilão</a>
                </div>
            </form>

            <p id="my-auctions-count" class="my-auctions-count" role="status" aria-live="polite"></p>
            <section aria-labelledby="my-auctions-results-title">
                <h2 id="my-auctions-results-title" class="sr-only">Resultados</h2>
                <div id="my-auctions-grid" class="auctions-grid" aria-live="polite"></div>
            </section>
        </div>
    </main>

    <footer class="footer" data-site-footer></footer>
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/pages/meus-leiloes.js"></script>
</body>
</html>
